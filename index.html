<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉장고 파먹기</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;500;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent-color: #6c5ce7;
            --accent-hover: #5849be;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #2d3436;
            --success-color: #00b894;
            --chip-bg: #2d3436;
            --chip-selected: #6c5ce7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
            background: radial-gradient(circle at center, rgba(108, 92, 231, 0.1) 0%, transparent 70%);
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Search & Filter Section */
        .filter-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .search-box {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-family: inherit;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .ingredient-suggestions {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin: -0.75rem 0 1rem;
            padding: 8px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-height: 280px;
            overflow-y: auto;
        }

        .ingredient-suggestions.active {
            display: flex;
        }

        .ingredient-suggestions::-webkit-scrollbar {
            width: 8px;
        }

        .ingredient-suggestions::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .suggestion-btn {
            width: 100%;
            padding: 10px 12px;
            background: transparent;
            color: var(--text-primary);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
            text-align: left;
        }

        .suggestion-btn:hover,
        .suggestion-btn:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.07);
        }

        .selected-ingredients {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0 0 1.5rem;
        }

        .selected-ingredient-btn {
            padding: 8px 12px;
            background: var(--chip-selected);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            cursor: pointer;
            font: inherit;
            font-size: 0.9rem;
        }

        .selected-ingredient-btn:hover,
        .selected-ingredient-btn:focus {
            outline: none;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .chip {
            padding: 8px 16px;
            background: var(--chip-bg);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
            border: 1px solid transparent;
            user-select: none;
        }

        .chip:hover {
            transform: translateY(-2px);
            background: #3d4648;
        }

        .chip.selected {
            background: var(--chip-selected);
            color: white;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.5rem 0;
            padding: 0 1rem;
        }

        .selected-count {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .btn-clear {
            padding: 8px 16px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        /* Results Section */
        .results-section h2 {
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            border-left: 4px solid var(--accent-color);
            padding-left: 1rem;
        }

        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .recipe-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }

        .card-content {
            padding: 1.5rem;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.4;
            display: -webkit-box;
            background-clip: text;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-ingredients {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .ing-tag {
            font-size: 0.8rem;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            color: var(--text-secondary);
        }

        .ing-tag.match {
            color: var(--success-color);
            background: rgba(0, 184, 148, 0.1);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px dashed var(--border-color);
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .tab-btn {
            padding: 10px 28px;
            background: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Housework Section */
        .housework-search-box {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-family: inherit;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .housework-search-box:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .housework-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
        }

        .housework-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }

        .housework-card .card-title {
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-card { cursor: default; }
        .product-card:hover { transform: none; }
        .product-sources { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .product-sources a { color: var(--accent-color); }

        .good-item-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .item-category-tag {
            display: inline-block;
            width: fit-content;
            margin-top: 1rem;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 999px;
            color: var(--success-color);
            background: rgba(0, 184, 148, 0.1);
            border: 1px solid rgba(0, 184, 148, 0.2);
        }

        .recipe-card .item-category-tag {
            margin: 0 0 1rem;
        }

        #recipeCategories .chip {
            padding: 12px 22px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .weekly-recommendation {
            margin-bottom: 1.5rem;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
        }

        .weekly-toggle {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            background: transparent;
            color: var(--text-primary);
            border: 0;
            cursor: pointer;
            font: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
        }

        .weekly-toggle:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: 4px;
        }

        .weekly-toggle-icon {
            color: var(--text-secondary);
        }

        .weekly-content {
            margin-top: 0.75rem;
        }

        .weekly-source {
            margin-top: 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .weekly-source a {
            color: var(--success-color);
            text-decoration: none;
        }

        .weekly-items {
            margin-left: 1.2rem;
            color: var(--text-primary);
        }

        .weekly-items li {
            margin: 0.25rem 0;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .container {
                padding: 1rem;
            }

            .filter-section {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>냉장고 파먹기</h1>
            <p class="subtitle">요리를 합시다 👌</p>
        </header>

        <div class="tab-nav">
            <button class="tab-btn active" data-tab="recipe" onclick="switchTab('recipe')">요리 레시피</button>
            <button class="tab-btn" data-tab="housework" onclick="switchTab('housework')">집안일</button>
            <button class="tab-btn" data-tab="goodItem" onclick="switchTab('goodItem')">꿀템</button>
            <button class="tab-btn" data-tab="beauty" onclick="switchTab('beauty')">뷰티</button>
        </div>

        <!-- Recipe Tab -->
        <div id="tab-recipe" class="tab-content active">
            <div class="filter-section">
                <input type="text" id="searchInput" class="search-box" placeholder="재료나 요리 검색">

                <div id="ingredientSuggestions" class="ingredient-suggestions">
                    <!-- Ingredient suggestions injected by JS -->
                </div>

                <div id="selectedIngredients" class="selected-ingredients">
                    <!-- Selected ingredient buttons injected by JS -->
                </div>

                <div id="weeklyRecommendation" class="weekly-recommendation">
                    <button type="button" id="weeklyToggle" class="weekly-toggle" aria-expanded="true"
                        onclick="toggleWeeklyRecommendation()">
                        <span>이번주의 재료 추천!</span>
                        <span id="weeklyToggleIcon" class="weekly-toggle-icon">접기</span>
                    </button>
                    <div id="weeklyContent" class="weekly-content">
                        <ul id="weeklyIngredientRecommendations" class="weekly-items"></ul>
                        <div class="weekly-source">
                            <a id="weeklyOriginalLink" href="#" target="_blank" rel="noopener">전단 원본 보기</a>
                        </div>
                    </div>
                </div>

                <div id="recipeCategories" class="good-item-categories">
                    <!-- Recipe category chips injected by JS -->
                </div>

                <div class="control-bar">
                    <span class="selected-count">Selected: <span id="countValue">0</span></span>
                    <button class="btn-clear" onclick="clearSelection()">Reset Selection</button>
                </div>
            </div>

            <div class="results-section">
                <h2>Matching Recipes <span id="matchCount"
                        style="font-size: 0.8em; color: var(--text-secondary); font-weight: normal;"></span></h2>
                <div id="recipesContainer" class="recipes-grid">
                    <!-- Recipe Cards injected by JS -->
                </div>
            </div>
        </div>

        <!-- Housework Tab -->
        <div id="tab-housework" class="tab-content">
            <div class="filter-section">
                <input type="text" id="houseworkSearchInput" class="housework-search-box" placeholder="상품명 또는 분야 검색">
                <div class="control-bar">
                    <span class="selected-count">상품 <span id="houseworkCount">0</span>개</span>
                </div>
            </div>

            <div class="results-section">
                <h2>집안일 상품 목록 <span id="houseworkMatchCount"
                        style="font-size: 0.8em; color: var(--text-secondary); font-weight: normal;"></span></h2>
                <div id="houseworkContainer" class="recipes-grid">
                    <!-- Product cards injected by JS -->
                </div>
            </div>
        </div>

        <!-- Good Item Tab -->
        <div id="tab-goodItem" class="tab-content">
            <div class="filter-section">
                <input type="text" id="goodItemSearchInput" class="housework-search-box" placeholder="상품명 또는 분야 검색">
                <div id="goodItemCategories" class="good-item-categories">
                    <!-- Good item category chips injected by JS -->
                </div>
                <div class="control-bar">
                    <span class="selected-count">상품 <span id="goodItemCount">0</span>개</span>
                    <button class="btn-clear" onclick="clearGoodItemCategory()">소분류 초기화</button>
                </div>
            </div>

            <div class="results-section">
                <h2>상품 목록 <span id="goodItemMatchCount"
                        style="font-size: 0.8em; color: var(--text-secondary); font-weight: normal;"></span></h2>
                <div id="goodItemContainer" class="recipes-grid">
                    <!-- Product cards injected by JS -->
                </div>
            </div>
        </div>

        <!-- Beauty Tab -->
        <div id="tab-beauty" class="tab-content">
            <div class="filter-section">
                <input type="text" id="beautySearchInput" class="housework-search-box" placeholder="상품명 또는 분야 검색">
                <div class="control-bar">
                    <span class="selected-count">상품 <span id="beautyCount">0</span>개</span>
                </div>
            </div>

            <div class="results-section">
                <h2>뷰티 상품 목록 <span id="beautyMatchCount"
                        style="font-size: 0.8em; color: var(--text-secondary); font-weight: normal;"></span></h2>
                <div id="beautyContainer" class="recipes-grid">
                    <!-- Product cards injected by JS -->
                </div>
            </div>
        </div>
    </div>

        function getIngredientSuggestions(state) {
            const term = state.searchTerm.trim();
            if (!term) return [];

            const scores = new Map();
            const addScore = (ing, score) => {
                if (!state.selected.has(ing)) {
                    scores.set(ing, Math.max(scores.get(ing) || 0, score));
                }
            };

            state.allIngredients.forEach(ing => {
                const name = ing.toLowerCase();
                if (name === term) {
                    addScore(ing, 4000);
                } else if (name.startsWith(term)) {
                    addScore(ing, 3000);
                } else if (name.includes(term)) {
                    addScore(ing, 2000);
                }
            });

            return Array.from(scores.entries())
                .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ko'))
                .slice(0, 8)
                .map(([ing]) => ing);
        }

                ingredients.forEach(name => {
                    const item = document.createElement('li');
                    item.textContent = name;
                    ingredientContainer.appendChild(item);
                });
            }

            originalLink.href = data.source_url || '#';
        }

        // Render Recipes
        function renderRecipes(state) {
            const container = document.getElementById('recipesContainer');
            const matchCountEl = document.getElementById('matchCount');
            container.innerHTML = '';

            // 1. First Filter: Title Search
            let titleFiltered = state.recipes.filter(recipe => {
                const titleMatches = recipe.title.toLowerCase().includes(state.searchTerm);
                const categoryMatches = !state.selectedCategory || recipe.category === state.selectedCategory;
                return titleMatches && categoryMatches;
            });
            let displayRecipes;

            if (state.selected.size === 0) {
                displayRecipes = titleFiltered;
            } else {
                const selectedArray = Array.from(state.selected);

                // 2. Second Filter: AND condition (all selected ingredients match)
                displayRecipes = titleFiltered.filter(recipe => {
                    const rIngs = new Set(recipe.ingredients);
                    return selectedArray.every(sel => rIngs.has(sel));
                });

                // 3. Sort: By number of matching ingredients (Descending)
                displayRecipes.sort((a, b) => {
                    const aIngs = new Set(a.ingredients);
                    const bIngs = new Set(b.ingredients);

                    const aMatchCount = selectedArray.filter(sel => aIngs.has(sel)).length;
                    const bMatchCount = selectedArray.filter(sel => bIngs.has(sel)).length;

                    return bMatchCount - aMatchCount;
                });
            }

            matchCountEl.textContent = `(${displayRecipes.length})`;

            if (displayRecipes.length === 0) {
                container.innerHTML = `<div class="empty-state">No recipes found with these ingredients.</div>`;
                return;
            }

            displayRecipes.forEach(recipe => {
                const card = document.createElement('a');
                card.href = recipe.link;
                card.className = 'recipe-card';
                card.target = "_blank";

                const ingHtml = recipe.ingredients.map(ing => {
                    const isMatch = state.selected.has(ing);
                    return `<span class="ing-tag ${isMatch ? 'match' : ''}">${ing}</span>`;
                }).join('');

                card.innerHTML = `
                <div class="card-content">
                    <div class="card-title">${recipe.title}</div>
                    <span class="item-category-tag">${recipe.category || '기타'}</span>
                    <div class="card-ingredients">
                        ${ingHtml}
                    </div>
                </div>
            `;
                container.appendChild(card);
            });
        }

        function renderGoodItemCategories(goodItemState) {
            const container = document.getElementById('goodItemCategories');
            container.innerHTML = '';

            goodItemState.categories.forEach(category => {
                const btn = document.createElement('div');
                btn.className = `chip ${goodItemState.selectedCategory === category ? 'selected' : ''}`;
                btn.textContent = category;
                btn.onclick = () => window.toggleGoodItemCategory(category);
                container.appendChild(btn);
            });
        }

        function renderProducts(state, containerId, countId) {
            const container = document.getElementById(containerId);
            const matchCountEl = document.getElementById(countId);
            container.innerHTML = '';

            const filtered = state.products.filter(([category, name]) => {
                const titleMatches = `${category} ${name}`.toLowerCase().includes(state.searchTerm);
                const categoryMatches = !state.selectedCategory || category === state.selectedCategory;
                return titleMatches && categoryMatches;
            });

            matchCountEl.textContent = `(${filtered.length})`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">일치하는 상품이 없습니다.</div>`;
                return;
            }

            filtered.forEach(([category, name, ids]) => {
                const card = document.createElement('div');
                card.className = 'housework-card product-card';
                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = `[${category}] ${name}`;
                card.appendChild(title);
                const sources = document.createElement('div');
                sources.className = 'product-sources';
                ids.split(',').forEach((id, index) => {
                    const link = document.createElement('a');
                    link.href = `https://www.youtube.com/watch?v=${id}`;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = ids.includes(',') ? `출처 ${index + 1}` : '출처';
                    sources.appendChild(link);
                });
                card.appendChild(sources);
                container.appendChild(card);
            });
        }

    </script>
